name: Dashboard tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05_Platform_Builds/Dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 05_Platform_Builds/Dashboard/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npx tsc -b
      - run: npm run lint
